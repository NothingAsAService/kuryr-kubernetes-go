# Sample kuryr.conf.
#
# This is the reference copy: "make run" points --config-file at it, and it is
# the file to copy and edit when standing a cluster up by hand. The in-cluster
# counterpart is the ConfigMap in config/manager/kuryr_config.yaml, which is
# what a deployed controller and CNI agent actually read. The two are separate
# on purpose -- this one runs the controller from a workstation against a
# cluster, that one runs it inside a container -- so a change worth keeping
# usually belongs in both.
#
# Both binaries read this same file. The controller ignores [cni_daemon] and
# the daemon ignores most of [kubernetes]; nothing here is per-binary.
#
# Every value marked REQUIRED is a placeholder and has to be replaced. The
# defaults for everything else are the ones in pkg/config.Defaults(), so a key
# left commented out behaves exactly as if it were absent.

[DEFAULT]
debug = false

[kubernetes]
# api_root is only needed to reach the API server somewhere other than where
# the in-cluster service account or ~/.kube/config points.
# api_root = https://127.0.0.1:6443

# Which parts of Kuryr run. Handlers come in pairs: one writes the intent as a
# CRD, the other makes OpenStack match it. Enabling half a pair is rejected at
# startup rather than silently doing nothing.
#
# This is the minimum that gives pods addresses and Services load balancers.
# Add namespace,kuryrnetwork for per-namespace subnets, and
# policy,kuryrnetworkpolicy for NetworkPolicy support -- if you add the
# latter, pod_security_groups_driver below has to say policy too, which is
# checked at startup.
enabled_handlers = vif,kuryrport,service,kuryrloadbalancer

pod_project_driver = default
service_project_driver = default
namespace_project_driver = default
network_policy_project_driver = default

# default puts every pod on [neutron_defaults]pod_subnet. namespace gives each
# Kubernetes namespace its own Neutron subnet instead, which is what lets a
# NetworkPolicy selecting a whole namespace become one security group rule
# rather than one per pod. It needs the namespace and kuryrnetwork handlers
# and [namespace_subnet]pod_router.
#
# annotation is for multi-tenant clusters: a pod, or its namespace, names an
# existing Neutron subnet with openstack.org/kuryr-subnet-id and its ports are
# created there. It is an override rather than a replacement -- pods that
# annotate nothing are served by [annotation_subnet]fallback_driver -- and it
# never creates a subnet.
pod_subnets_driver = default
service_subnets_driver = default

# default applies [neutron_defaults]pod_security_groups to every pod. policy
# makes the groups follow NetworkPolicy instead; both of these must say policy
# together, or groups get created and never applied to anything.
pod_security_groups_driver = default
service_security_groups_driver = default

# neutron-vif for bare metal nodes. nested-vlan for pods inside node VMs,
# which attaches their ports to the node VM trunk as subports; nested-macvlan
# is the trunkless alternative, with no per-node VLAN limit and no Neutron
# filtering. nested-dpdk hands the interface to a userspace driver in the pod;
# it goes through Nova and requires vif_pool_driver = noop.
pod_vif_driver = neutron-vif

# noop creates a port per pod on demand. neutron keeps a pool of pre-created
# ports, trading Neutron quota for pod start latency -- see [vif_pool].
vif_pool_driver = noop

# Extra interfaces from NetworkAttachmentDefinitions. npwg reads the
# Multus-compatible annotation; noop gives every pod exactly one interface.
# npwg_multiple_interfaces, the name the Python implementation used, is
# accepted as well.
multi_vif_drivers = noop

# Active/passive HA through a Lease. The --leader-elect flag overrides this.
controller_ha = false

# Naming Neutron ports after their pod costs an extra write per port, and is
# worth it the first time you have to read a port list during an incident.
port_debug = true

# max_concurrent_reconciles = 10

[neutron_defaults]
# REQUIRED: the OpenStack project everything is created in.
project = <project-uuid>

# REQUIRED unless pod_subnets_driver is namespace: the subnet pods get
# addresses from.
pod_subnet = <pod-subnet-uuid>

# REQUIRED by the service handler: the Neutron subnet the cluster's service
# CIDR is carved from. Nothing lives on it; it exists so Octavia can hold a
# VIP at each Service's clusterIP.
service_subnet = <service-subnet-uuid>

# REQUIRED unless pod_security_groups_driver is policy: the groups a pod gets
# when no NetworkPolicy selects it. Comma-separated.
pod_security_groups = <security-group-uuid>

# The integration bridge the CNI agent plugs veth pairs into.
ovs_bridge = br-int

# Only needed for Services of type LoadBalancer. Without it such a Service is
# reported as unsupported rather than left silently without an address.
# external_svc_net = <external-network-uuid>
# external_svc_subnet = <external-subnet-uuid>

# Tags put on every resource Kuryr creates, which is how an operator tells
# them apart from everything else in the project.
resource_tags = kuryr

# Per-driver subnet overrides for the npwg multi-VIF driver, in the
# oslo.config dict form "name:value,name:value".
# subnet_mapping = nested-vlan:<subnet-uuid>

[octavia_defaults]
# L3 routes load balancer traffic to members through a router, so Octavia is
# told the load balancer's own subnet. L2 bridges it instead and needs the
# subnet each backend actually sits on, which also makes
# [annotation_subnet]
# Only read when pod_subnets_driver = annotation.
#
# Which driver serves pods that carry no openstack.org/kuryr-subnet-id
# annotation. Normally default or namespace; it cannot be annotation itself.
# fallback_driver = default

# Refuse a subnet owned by a project other than the pod's own, which is what
# stops a pod annotation from being a way onto another tenant's network. Leave
# it on unless every user who can set a pod annotation is already trusted with
# every subnet the controller credentials can see. Pair it with
# pod_project_driver = annotation so each namespace names its tenant's project.
# enforce_project = true

[pod_vif_nested]worker_nodes_subnets load bearing for backends that turn out
# to be on the node network.
member_mode = L3
lb_algorithm = ROUND_ROBIN

# Only meaningful with the Amphora provider, which rewrites the source address
# so a backend's own security groups cannot see the real client. Kuryr then
# derives the VIP rules from what those backends allow.
enforce_sg_rules = true

# timeout_client_data = 50000
# timeout_member_data = 50000

[vif_pool]
# Ports are created ports_pool_batch at a time whenever a pool drops below
# ports_pool_min, in the background, so a pod is served from the pool instead
# of waiting on Neutron. Only used when vif_pool_driver = neutron.
ports_pool_min = 5
ports_pool_batch = 10
# 0 means no ceiling: a port handed back by a deleted pod is always recycled
# rather than deleted.
ports_pool_max = 0
ports_pool_update_frequency = 20

# For clusters mixing bare metal and nested nodes, in the dict form
# "vif-driver:pool-driver".
# vif_pool_mapping = neutron-vif:neutron,nested-vlan:nested

[namespace_subnet]
# REQUIRED by pod_subnets_driver = namespace: the router each per-namespace
# subnet is attached to.
# pod_router = <router-uuid>
# pod_subnet_pool = <subnet-pool-uuid>

[annotation_subnet]
# Only read when pod_subnets_driver = annotation.
#
# Which driver serves pods that carry no openstack.org/kuryr-subnet-id
# annotation. Normally default or namespace; it cannot be annotation itself.
# fallback_driver = default

# Refuse a subnet owned by a project other than the pod's own, which is what
# stops a pod annotation from being a way onto another tenant's network. Leave
# it on unless every user who can set a pod annotation is already trusted with
# every subnet the controller credentials can see. Pair it with
# pod_project_driver = annotation so each namespace names its tenant's project.
# enforce_project = true

[pod_vif_nested]
# The Neutron subnets the Kubernetes nodes live on. NetworkPolicy security
# groups always allow ingress from them, so kubelet probes keep working on an
# otherwise isolated pod. Also how L2 member mode resolves a backend that sits
# on the node network rather than a pod one.
# worker_nodes_subnets = <node-subnet-uuid>

[binding]
# The node uplink a nested VIF hangs off. Left empty, the binding driver
# detects it, which is right unless the node has more than one candidate.
# link_iface = eth0

[cni_daemon]
# Where the daemon listens for the kuryr-cni plugin. The plugin defaults to
# this same address, so changing it means changing daemonAddress in
# etc/cni/net.d/kuryr.conflist.template too.
bind_address = 127.0.0.1:5036

# How long a CNI ADD waits for Neutron to bring the port to ACTIVE. The
# runtime enforces its own deadline above this one.
vif_annotation_timeout = 60
cni_failures_count = 3

# Set both of these when the daemon runs in a container, as it does in the
# DaemonSet: host namespace paths then need translating to where /proc is
# mounted inside it. Running the daemon on the host, leave them out.
# docker_mode = true
# netns_proc_dir = /host_proc

[nested_dpdk]
# Only used by the nested-dpdk binding driver.
# dpdk_driver = uio_pci_generic
# pci_mount_point = /var/pci_address

[vhostuser]
# Only used by the vhostuser binding driver.
# mount_point = /var/cni/vhostuser
# ovs_vhu_path = /var/run/openvswitch/

[prometheus_exporter]
# The controller's Deployment passes --metrics-bind-address, which takes
# precedence and serves over TLS with authentication; this port only applies
# when that flag is absent. The CNI agent has no such flag.
controller_exporter_port = 9654
cni_exporter_port = 9655

[neutron]
# REQUIRED: Keystone credentials. Any value left empty falls back to the
# matching OS_* environment variable, so an application credential can come
# from a Secret, or from a sourced openrc, instead of being written here.
auth_url = <keystone-url>
username = <username>
password = <password>
project_name = <project>
user_domain_name = Default
project_domain_name = Default
region_name = RegionOne

# An application credential is the better choice for a long-running service:
# it can be scoped and revoked without touching the user's password.
# application_credential_id = <credential-id>
# application_credential_secret = <credential-secret>

# cafile = /etc/ssl/certs/ca-bundle.crt
# insecure = false
