# The metrics endpoint is served over TLS and checks its callers. Doing that
# in-process, rather than behind a proxy sidecar, is what the current
# controller-runtime metrics server does, and it needs to be able to verify a
# bearer token and ask whether that identity may read metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-auth-role
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
